name: ci

# Two halves, and the split is the point:
#
#   * `host` builds and tests the two crates that have no hardware in them --
#     pycon (the language) and badgy-fat (the filesystem). They hold most of the
#     logic and all of the parsing of untrusted input, and they need no badge and
#     no riscv toolchain. They are what actually gates a merge.
#   * `firmware` proves the image still links and signs, which needs a riscv
#     target. It cannot check that the firmware *works* -- that takes a badge and
#     a pair of eyes.
#   * `rolling` publishes what `firmware` built, so the newest main is a download
#     rather than a login-walled Actions artifact that expires in 90 days. It
#     runs only after the other three pass, and only on main.
#
# Versioned releases are a different workflow: tag `v*` and release.yml builds
# and publishes that tag. This one never makes a version claim.
#
# Both halves bootstrap vendor/xous-core, and the host half wishes it did not.
# Nothing it compiles refers to that tree -- but `pycon` and `badgy-fat` are
# members of this workspace, and cargo loads *every* member's manifest before it
# will do anything at all, including the root `badgyos` package whose path
# dependencies point into vendor/xous-core. So `cargo test -p pycon` fails at
# manifest resolution, before a single crate is compiled, if the checkout is
# missing:
#
#     error: failed to load manifest for workspace member `.`
#     Caused by: failed to load manifest for dependency `bao1x-api`
#
# The alternative is to take the two crates out of the workspace so they resolve
# alone, which costs a second lockfile and breaks `cargo test -p pycon` from the
# root -- the command the Cargo.toml comment tells contributors to use. A cached
# blobless clone is cheaper than that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a test failure is worth more than the noise costs.
  RUST_BACKTRACE: 1

jobs:
  host:
    name: host tests (pycon + badgy-fat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        # Nightly is only for rustfmt: rustfmt.toml uses unstable options, which
        # is what keeps this tree's layout matching xous-core's. The code itself
        # builds and tests on stable.
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default stable

      # badgy-fat's tests shell out to real tools rather than trusting this
      # parser against its own formatter: mkfs.fat builds volumes, fsck.fat
      # judges the ones we build, and mtools writes files with long names. Three
      # tests skip themselves when mtools is absent, so it is installed here to
      # make sure CI is running the full set.
      - name: Install dosfstools and mtools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools

      # Only so that cargo will look at this workspace at all -- see the note at
      # the top of this file. Nothing below compiles a line of it.
      - name: Read the xous-core pin
        id: pin
        run: |
          sed -n 's/^[[:space:]]*url[[:space:]]*=[[:space:]]*//p'    xous-core.pin | head -1 | sed 's/^/url=/'    >> "$GITHUB_OUTPUT"
          sed -n 's/^[[:space:]]*commit[[:space:]]*=[[:space:]]*//p' xous-core.pin | head -1 | sed 's/^/commit=/' >> "$GITHUB_OUTPUT"

      - name: Cache the pinned xous-core checkout
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor/xous-core
          key: xous-core-${{ steps.pin.outputs.commit }}

      - name: Bootstrap vendor/xous-core
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        # XOUS_CORE is cleared so bootstrap.sh cannot adopt some other checkout
        # and quietly build against the wrong commit.
        run: XOUS_CORE= ./bootstrap.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: host

      # `--target` is explicit because .cargo/config.toml pins the riscv target
      # for this workspace, and these two crates are being tested for the host.
      - name: Test
        run: |
          cargo test --target x86_64-unknown-linux-gnu \
            -p pycon -p badgy-fat --features std

      - name: Check they are still no_std-clean
        # The firmware links them without `std`; a test-only `std` dependency
        # that creeps in would only fail in the firmware job, and only after a
        # ten-minute riscv build. This catches it in seconds.
        run: |
          cargo build --target x86_64-unknown-linux-gnu -p pycon -p badgy-fat

      - name: Format
        # Named packages rather than `--all`: the path dependencies into
        # vendor/xous-core are visible to `cargo fmt --all`, and pointing rustfmt
        # at that tree both reformats code we do not own and trips over a
        # `macro_rules!` in its locales crate.
        run: cargo +nightly fmt -p badgyos -p pycon -p badgy-fat --check

      - name: Clippy
        run: |
          cargo clippy --target x86_64-unknown-linux-gnu \
            -p pycon -p badgy-fat --features std --all-targets -- -D warnings

  sprites:
    name: sprites are in sync with the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # src/sprites.rs is generated art that is committed and hand-editable. That
      # is a deliberate trade, and this job is the tripwire for the half of it
      # that goes wrong quietly: a change to tools/badger.py that nobody ran.
      # A hand edit is fine and expected -- it just has to be ported back into
      # the generator, which is exactly what this asks for.
      - name: Re-emit and diff
        run: |
          ./tools/badger.py emit
          if ! git diff --exit-code -- src/sprites.rs; then
            echo "::error::src/sprites.rs differs from tools/badger.py output."
            echo "Run ./tools/badger.py emit and commit, or port the hand edit"
            echo "back into the generator."
            exit 1
          fi

  firmware:
    name: firmware image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the xous-core pin
        id: pin
        run: |
          sed -n 's/^[[:space:]]*url[[:space:]]*=[[:space:]]*//p'    xous-core.pin | head -1 | sed 's/^/url=/'    >> "$GITHUB_OUTPUT"
          sed -n 's/^[[:space:]]*commit[[:space:]]*=[[:space:]]*//p' xous-core.pin | head -1 | sed 's/^/commit=/' >> "$GITHUB_OUTPUT"

      # Keyed on the commit, so this is a cache hit until the pin moves.
      - name: Cache the pinned xous-core checkout
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor/xous-core
          key: xous-core-${{ steps.pin.outputs.commit }}

      - name: Bootstrap vendor/xous-core
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        # XOUS_CORE is cleared so bootstrap.sh cannot adopt some other checkout
        # and quietly build against the wrong commit.
        run: XOUS_CORE= ./bootstrap.sh

      - name: Install the riscv toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add riscv32imac-unknown-none-elf

      - uses: Swatinem/rust-cache@v2
        with:
          key: firmware
          # The host tools (xous-copy-object, xous-sign-image) are built inside
          # the vendored workspace, so its target dir is worth caching too.
          workspaces: |
            .
            vendor/xous-core

      # build.sh does the whole pipeline: cargo build -> copy-object -> sign,
      # and prints the poke-table and heap/stack numbers that only fail at boot.
      - name: Build, package and sign
        run: ./build.sh

      - name: Validate the image the way boot1 will
        # The flasher's dry run is the same check boot1's UF2 receiver applies,
        # except that boot1 does it silently: a block with the wrong family ID or
        # an out-of-window target is dropped without an error, and the first sign
        # of trouble is a badge that fails its signature check on next boot.
        run: |
          ./tools/badgeflash.py --dry-run \
            target/riscv32imac-unknown-none-elf/release/badgyos.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: badgyos-uf2
          path: |
            target/riscv32imac-unknown-none-elf/release/badgyos.uf2
            target/riscv32imac-unknown-none-elf/release/badgyos.img
          if-no-files-found: error

  rolling:
    name: rolling release from main
    # Only after everything else is green, so a release never carries an image
    # whose language tests failed. And only on main: a pull request must not be
    # able to publish.
    needs: [host, sprites, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The image the `firmware` job already built and validated, rather than a
      # second build of the same commit. What is published is then the artifact
      # that was actually checked, not one that merely should be identical.
      - uses: actions/download-artifact@v4
        with:
          name: badgyos-uf2
          path: dist

      - name: Checksum, and re-read the image the way boot1 will
        id: image
        run: |
          ./tools/badgeflash.py --dry-run dist/badgyos.uf2 | tee /tmp/validate.txt
          (cd dist && sha256sum badgyos.uf2 > badgyos.uf2.sha256)
          {
            echo 'report<<EOF'
            sed 's/^/    /' /tmp/validate.txt
            echo EOF
            # Re-read here rather than reusing the firmware job's step output:
            # outputs do not cross jobs.
            sed -n 's/^[[:space:]]*commit[[:space:]]*=[[:space:]]*//p' xous-core.pin | head -1 | sed 's/^/pin=/'
          } >> "$GITHUB_OUTPUT"

      # Move the tag to this commit before publishing, so the release page shows
      # the source it was built from rather than wherever `latest` pointed last
      # week. Force, because it is a rolling tag by design.
      #
      # This push cannot start another run: ci.yml triggers on branches, and
      # release.yml only on tags matching `v*`.
      - name: Move the rolling tag
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build from main
          # A prerelease on purpose: it is a commit, not a version. Note that
          # this also means /releases/latest -- which resolves to the newest
          # *non*-prerelease -- will not point here, which is the intent. The
          # stable link is the asset URL in the body below.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/badgyos.uf2
            dist/badgyos.uf2.sha256
          body: |
            The current state of `main`, rebuilt and replaced on every push.
            Not a version: for one of those, see the tagged releases.

            ```
            ./tools/badgeflash.py badgyos.uf2
            ```

            Always the newest:
            <https://github.com/${{ github.repository }}/releases/download/latest/badgyos.uf2>

            ## Flashing this is irreversible

            `badgyos.uf2` is signed with xous-core's **developer** key, whose
            private half is published. When boot1 validates a developer-signed
            image it erases the badge's secrets and increments the
            `DEVELOPER_MODE` one-way counter:

            * **`k0`, the DEF CON light-encryption key, is destroyed** and cannot
              be recovered. Reflashing the stock firmware does not bring it back.
              The badge is out of the conference light-breeding game for good.
            * The badge is permanently marked as a developer device.

            Because the signing key is public, this signature says nothing about
            who built the file. Verify the checksum against this run, or build it
            yourself -- `./bootstrap.sh && ./build.sh` is the whole recipe.

            ## Image

            ```
            ${{ steps.image.outputs.report }}
            ```

            Built from `${{ github.sha }}` against xous-core
            `${{ steps.image.outputs.pin }}`.
